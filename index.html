<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deen &amp; Destiny — Character Creator</title>
    <style>
        /* =========================================================
       THEME
    ========================================================= */
        :root {
            --bg: #070b14;
            --surface: #0d1525;
            --surface2: #131e32;
            --border: #1c2c48;
            --border2: #263d66;
            --text: #c8d5e9;
            --text-dim: #506070;
            --text-muted: #7a90aa;
            --accent: #3b82f6;
            --gold: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;
            --w-col: #9333ea;
            --h-col: #16a34a;
            --t-col: #d97706;
            --glow-w: rgba(147, 51, 234, 0.35);
            --glow-h: rgba(22, 163, 74, 0.35);
            --glow-t: rgba(217, 119, 6, 0.35);
            --cls-color: var(--accent);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            min-height: 100vh;
            line-height: 1.5;
        }

        #app {
            max-width: 1180px;
            margin: 0 auto;
            padding: 12px 16px;
        }

        /* =========================================================
       TYPOGRAPHY & LAYOUT UTILITIES
    ========================================================= */
        h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        a {
            color: var(--accent);
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }

        .section-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* =========================================================
       BUTTONS
    ========================================================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 20px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .btn-primary:not(:disabled):hover {
            filter: brightness(1.15);
        }

        .btn-secondary {
            background: var(--surface2);
            color: var(--text);
            border-color: var(--border2);
        }

        .btn-secondary:not(:disabled):hover {
            border-color: var(--accent);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border2);
        }

        .btn-outline:not(:disabled):hover {
            border-color: var(--text-muted);
            color: var(--text);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        .btn-danger:not(:disabled):hover {
            filter: brightness(1.15);
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: .8rem;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: .85rem;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-back:hover {
            color: var(--text);
        }

        /* =========================================================
       FORMS
    ========================================================= */
        .form-group {
            margin-bottom: 16px;
        }

        .form-row-double {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-hint {
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            color: var(--text-dim);
            font-size: .72rem;
        }

        .level-info-box {
            background: rgba(59, 130, 246, .07);
            border: 1px solid rgba(59, 130, 246, .22);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: .8rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .level-info-box strong {
            color: var(--text);
        }

        .form-label {
            display: block;
            font-size: .8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input,
        .slot-input,
        .slot-select {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 5px;
            color: var(--text);
            padding: 7px 10px;
            font-size: .9rem;
            outline: none;
        }

        .form-input:focus,
        .slot-input:focus,
        .slot-select:focus {
            border-color: var(--accent);
        }

        .slot-input.spare {
            background: var(--surface);
            font-size: .8rem;
        }

        .slot-select {
            cursor: pointer;
        }

        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }

        .notes-area {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 5px;
            color: var(--text);
            padding: 8px 10px;
            font-size: .85rem;
            resize: vertical;
            min-height: 90px;
            outline: none;
            font-family: inherit;
        }

        .notes-area:focus {
            border-color: var(--accent);
        }

        /* =========================================================
       SITE HEADER
    ========================================================= */
        .site-header {
            text-align: center;
            padding: 28px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }

        .site-header.compact {
            padding: 12px 0;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .site-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: .15em;
            text-transform: uppercase;
        }

        .site-title.small {
            font-size: 1.1rem;
        }

        .site-title-d {
            color: var(--gold);
        }

        .site-title-amp {
            color: var(--text-muted);
            margin: 0 6px;
        }

        .site-subtitle {
            font-size: .9rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        /* =========================================================
       HOME VIEW
    ========================================================= */
        .home-main {
            min-height: 300px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .char-card {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-left: 3px solid var(--cls-color);
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s;
        }

        .char-card:hover {
            box-shadow: 0 0 12px rgba(255, 255, 255, .05);
            border-color: var(--cls-color);
        }

        .char-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .char-card-name {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .char-card-meta {
            font-size: .8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .char-card-levels {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .level-badge {
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: .75rem;
            font-weight: 700;
            color: var(--gold);
        }

        .char-card-stats {
            display: flex;
            gap: 12px;
            font-size: .8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .char-card-actions {
            display: flex;
            gap: 8px;
        }

        .home-actions {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .io-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .import-notice {
            font-size: .78rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 6px;
        }

        /* =========================================================
       CREATOR WIZARD
    ========================================================= */
        .creator-wrap {
            max-width: 900px;
            margin: 0 auto;
        }

        .step-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            overflow-x: auto;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: max-content;
            padding: 0 6px;
            color: var(--text-dim);
            position: relative;
        }

        .step-item:not(:last-child)::after {
            content: '›';
            position: absolute;
            right: -6px;
            color: var(--border2);
            font-size: 1.1rem;
        }

        .step-item.active {
            color: var(--accent);
        }

        .step-item.done {
            color: var(--success);
        }

        .step-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step-item.active .step-dot {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .step-item.done .step-dot {
            background: var(--success);
            border-color: var(--success);
            color: #fff;
        }

        .step-label {
            font-size: .8rem;
            font-weight: 600;
        }

        .step-content {
            max-width: 820px;
        }

        .step-title {
            margin-bottom: 6px;
        }

        .step-desc {
            color: var(--text-muted);
            margin-bottom: 16px;
            font-size: .9rem;
        }

        .subsection-title {
            font-size: .85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--text-muted);
            margin: 20px 0 10px;
        }

        .step-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* OPTION CARDS (race / subclass) */
        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .option-card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .option-card:hover {
            border-color: var(--border2);
        }

        .option-card.selected {
            border-color: var(--accent);
            background: rgba(59, 130, 246, .07);
        }

        .option-card.subclass-card.selected {
            border-color: var(--cls-color);
            background: color-mix(in srgb, var(--cls-color) 8%, transparent);
        }

        .option-icon {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .option-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .option-motto {
            font-style: italic;
            color: var(--gold);
            font-size: .82rem;
            margin-bottom: 6px;
        }

        .option-desc {
            font-size: .82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .option-traits {
            list-style: none;
            font-size: .78rem;
            color: var(--text-muted);
        }

        .option-traits li::before {
            content: '• ';
            color: var(--accent);
        }

        .option-abilities {
            margin-top: 8px;
        }

        .ability-chip {
            background: rgba(59, 130, 246, .1);
            border: 1px solid rgba(59, 130, 246, .25);
            border-radius: 4px;
            padding: 4px 7px;
            font-size: .75rem;
            margin-top: 4px;
        }

        .special-rule {
            background: rgba(245, 158, 11, .08);
            border: 1px solid rgba(245, 158, 11, .25);
            border-radius: 4px;
            padding: 5px 8px;
            font-size: .78rem;
            color: var(--gold);
            margin-top: 8px;
        }

        .ability-list-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .ability-preview-name {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 2px 6px;
            font-size: .72rem;
        }

        .ability-preview-more {
            color: var(--text-dim);
            font-size: .72rem;
            padding: 2px 4px;
        }

        .super-preview {
            margin-top: 8px;
            font-size: .78rem;
            color: var(--text-muted);
        }

        /* CLASS CARDS */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .class-card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all .15s;
            position: relative;
        }

        .class-card:hover {
            border-color: var(--cls-color);
        }

        .class-card.selected {
            border-color: var(--cls-color);
            box-shadow: 0 0 0 1px var(--cls-color);
            background: color-mix(in srgb, var(--cls-color) 5%, var(--surface));
        }

        .class-name {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--cls-color);
        }

        .class-tagline {
            font-style: italic;
            font-size: .82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .class-desc {
            font-size: .82rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .class-traits-title {
            font-size: .75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .class-traits {
            list-style: none;
            font-size: .78rem;
            margin-bottom: 10px;
        }

        .class-traits li::before {
            content: '▸ ';
            color: var(--cls-color);
        }

        .class-combat-info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .info-chip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: .75rem;
        }

        /* ABILITY SELECTION (step 4) */
        .selection-count {
            display: inline-block;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 4px;
            padding: 4px 10px;
            font-size: .85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .selection-count.done {
            color: var(--success);
            border-color: var(--success);
        }

        .ability-selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .ability-select-card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 7px;
            padding: 12px;
            cursor: pointer;
            transition: all .15s;
        }

        .ability-select-card:hover:not(.disabled) {
            border-color: var(--border2);
        }

        .ability-select-card.selected {
            border-color: var(--accent);
            background: rgba(59, 130, 246, .07);
        }

        .ability-select-card.disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .ability-select-header {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 6px;
        }

        .ability-select-name {
            font-weight: 700;
            font-size: .9rem;
            flex: 1;
        }

        .check {
            color: var(--success);
            font-size: 1rem;
        }

        .ability-select-desc {
            font-size: .78rem;
            color: var(--text-muted);
            line-height: 1.5;
            white-space: pre-line;
        }

        .ability-type-badge {
            font-size: .65rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid;
        }

        .ability-type-badge.ability {
            color: var(--accent);
            border-color: rgba(59, 130, 246, .4);
            background: rgba(59, 130, 246, .1);
        }

        .ability-type-badge.passive {
            color: var(--success);
            border-color: rgba(34, 197, 94, .4);
            background: rgba(34, 197, 94, .1);
        }

        .ability-type-badge.channeling {
            color: var(--gold);
            border-color: rgba(245, 158, 11, .4);
            background: rgba(245, 158, 11, .1);
        }

        /* STAT ALLOCATION (step 5) */
        .points-remaining {
            display: inline-block;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 4px;
            padding: 5px 12px;
            font-size: .9rem;
            margin-bottom: 16px;
        }

        .points-remaining.done {
            border-color: var(--success);
            color: var(--success);
        }

        .stat-alloc-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 480px;
        }

        .stat-alloc-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
        }

        .stat-alloc-label {
            display: flex;
            flex-direction: column;
        }

        .stat-name {
            font-weight: 700;
            font-size: .9rem;
        }

        .stat-hint,
        .stat-hint-small {
            font-size: .72rem;
            color: var(--text-dim);
        }

        .stat-alloc-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .12s;
        }

        .stat-btn:not(:disabled):hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .stat-btn:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            min-width: 28px;
            text-align: center;
        }

        /* =========================================================
       CHARACTER SHEET
    ========================================================= */
        .sheet-wrap {
            --cls-color: var(--accent);
        }

        .sheet-header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 3px solid var(--cls-color);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        .sheet-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .sheet-actions-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .points-alert {
            background: rgba(245, 158, 11, .12);
            border: 1px solid rgba(245, 158, 11, .4);
            color: var(--gold);
            border-radius: 4px;
            padding: 3px 10px;
            font-size: .78rem;
            font-weight: 700;
        }

        .sheet-title-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .sheet-name {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .sheet-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .meta-badge {
            border-radius: 4px;
            padding: 3px 9px;
            font-size: .75rem;
            font-weight: 700;
            border: 1px solid var(--border2);
            background: var(--surface2);
        }

        .meta-badge.ll {
            color: var(--gold);
            border-color: rgba(245, 158, 11, .35);
            background: rgba(245, 158, 11, .08);
        }

        .meta-badge.cl {
            color: var(--text-muted);
        }

        .sheet-body {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 14px;
        }

        @media (max-width: 720px) {
            .sheet-body {
                grid-template-columns: 1fr;
            }
        }

        .sheet-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .sheet-section.locked-section {
            opacity: .55;
        }

        .section-header {
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--cls-color);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 6px;
            text-align: center;
        }

        .stat-abbr {
            font-size: .68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .stat-val {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text);
        }

        .stat-max {
            font-size: .65rem;
            color: var(--text-dim);
        }

        /* DERIVED */
        .derived-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .derived-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            border-bottom: 1px solid var(--border);
        }

        .derived-item:last-child {
            border-bottom: none;
        }

        .derived-label {
            font-size: .8rem;
            color: var(--text-muted);
        }

        .derived-value {
            font-size: .9rem;
            font-weight: 700;
        }

        .derived-value.hp {
            color: var(--danger);
        }

        .derived-value.small {
            font-size: .75rem;
            text-align: right;
            max-width: 60%;
        }

        /* HP TRACKER */
        .hp-tracker {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .hp-current {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--danger);
            min-width: 40px;
            text-align: center;
        }

        .hp-label {
            font-size: .78rem;
            color: var(--text-muted);
        }

        .hp-input {
            width: 64px;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 5px;
            color: var(--text);
            padding: 4px 7px;
            font-size: .95rem;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .hp-input:focus {
            border-color: var(--danger);
        }

        /* COMBAT ACTIONS */
        .action-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .action-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            border-radius: 4px;
            background: var(--surface2);
        }

        .action-label {
            font-size: .82rem;
        }

        .action-label.light {
            color: var(--w-col);
        }

        .action-label.major {
            color: var(--t-col);
        }

        .action-label.bonus {
            color: var(--gold);
        }

        .action-label.move {
            color: var(--h-col);
        }

        .action-val {
            font-size: .85rem;
            font-weight: 700;
        }

        /* TRAIT LIST */
        .trait-list {
            list-style: none;
            font-size: .82rem;
            color: var(--text-muted);
        }

        .trait-list li {
            padding: 2px 0 2px 12px;
            position: relative;
        }

        .trait-list li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--cls-color);
        }

        .special-rule-box {
            background: rgba(245, 158, 11, .06);
            border: 1px solid rgba(245, 158, 11, .25);
            border-radius: 4px;
            padding: 6px 8px;
            font-size: .78rem;
            color: var(--gold);
            margin-top: 8px;
        }

        .race-light-abilities {
            margin-top: 8px;
        }

        .race-ability {
            background: rgba(59, 130, 246, .06);
            border: 1px solid rgba(59, 130, 246, .2);
            border-radius: 4px;
            padding: 6px 8px;
            font-size: .78rem;
            margin-top: 4px;
        }

        .race-ability-name {
            font-weight: 700;
            color: var(--accent);
            display: block;
            margin-bottom: 2px;
        }

        .race-ability-desc {
            color: var(--text-muted);
        }

        /* GEAR SLOTS */
        .gear-slots {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .gear-slot {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .slot-label {
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--text-dim);
        }

        /* ARMOR */
        .armor-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .armor-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .armor-label {
            font-size: .78rem;
            font-weight: 700;
            color: var(--text-muted);
            width: 50px;
            flex-shrink: 0;
        }

        .armor-row .slot-input {
            flex: 1;
        }

        /* GRENADES */
        .grenade-options {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }

        .grenade-info {
            font-size: .78rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .grenade-info strong {
            color: var(--text);
        }

        .grenade-slots {
            display: flex;
            gap: 10px;
        }

        .grenade-slots .gear-slot {
            flex: 1;
        }

        /* MELEE */
        .melee-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .melee-item {
            font-size: .82rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .melee-item strong {
            color: var(--text);
        }

        /* LIGHT ABILITIES */
        .ability-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ability-card {
            border-radius: 6px;
            padding: 10px 12px;
            border: 1px solid var(--border);
        }

        .ability-card.unlocked {
            background: var(--surface2);
            border-color: var(--border2);
        }

        .ability-card.locked {
            background: var(--surface);
            opacity: .5;
            filter: grayscale(.4);
        }

        .ability-card-header {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .ability-card-name {
            font-weight: 700;
            font-size: .88rem;
            flex: 1;
        }

        .ability-status {
            font-size: .72rem;
            font-weight: 700;
        }

        .ability-status:not(.locked) {
            color: var(--success);
        }

        .ability-status.locked {
            color: var(--text-dim);
        }

        .ability-card-desc {
            font-size: .78rem;
            color: var(--text-muted);
            white-space: pre-line;
            line-height: 1.5;
        }

        /* SUPER */
        .locked-content {
            color: var(--text-dim);
            font-size: .85rem;
            text-align: center;
            padding: 8px;
        }

        .super-content {}

        .super-base {
            font-size: .82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .super-subclass {
            font-size: .82rem;
            background: rgba(245, 158, 11, .06);
            border: 1px solid rgba(245, 158, 11, .2);
            border-radius: 4px;
            padding: 6px 8px;
            color: var(--gold);
        }

        /* =========================================================
       MODAL
    ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 10px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .levelup-modal h3 {
            margin-bottom: 14px;
            font-size: 1.1rem;
        }

        .levelup-modal p {
            color: var(--text-muted);
            margin-bottom: 12px;
            font-size: .88rem;
        }

        .levelup-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .levelup-options .btn {
            text-align: left;
            height: auto;
            padding: 12px 16px;
            justify-content: flex-start;
            line-height: 1.4;
        }

        .levelup-options .btn small {
            display: block;
            font-weight: 400;
            color: rgba(255, 255, 255, .6);
            margin-top: 2px;
            font-size: .78rem;
        }

        .ability-unlock-modal .ability-selection-grid {
            margin-top: 8px;
        }

        .modal-stat-grid {
            max-width: 100%;
        }

        /* =========================================================
       MISC
    ========================================================= */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }
    </style>
</head>

        function derived(ch) {
            const cls = CLASSES[ch.class];
            const race = RACES[ch.race];
            const sub = SUBCLASSES[ch.subclass];

            const hp = ch.stats.health * cls.healthConversion;

            let baseSpd = 25;
            if (race.speedBonus) baseSpd += race.speedBonus;
            if (cls.speedBonus) baseSpd += cls.speedBonus;
            if (sub.id === 'breaker') baseSpd += 20;
            const totalSpd = baseSpd + Math.floor(ch.stats.speed / 2) * 5;

            const atkBonus = Math.floor(ch.stats.agility / 2);
            const wepDmgBonus = Math.floor(ch.stats.strength / 3);
            const ltDmgBonus = Math.floor(ch.stats.wisdom / 3);

            let staminaTier = 'Base';
            if (ch.stats.stamina >= 20) staminaTier = 'Tier 3 — 2 turns back-to-back';
            else if (ch.stats.stamina >= 16) staminaTier = 'Tier 2 — extra Major/Light action';
            else if (ch.stats.stamina >= 8) staminaTier = 'Tier 1 — extra Bonus action';

            const chaosCharges = sub.id === 'chaos' ? 2 * ch.lightLevel : null;

            const lightActions = ch.class === 'warlock' ? 2 : 1;
            const majorActions = sub.id === 'breaker' ? 2 : 1;

            return { hp, totalSpd, atkBonus, wepDmgBonus, ltDmgBonus, staminaTier, chaosCharges, lightActions, majorActions };
        }

          <span class="meta-badge sub">${sub.name}</span>
          <span class="meta-badge ll">LL ${ch.lightLevel}</span>
          <span class="meta-badge cl">CL ${ch.characterLevel}</span>
        </div>
      </div>

      <!-- BODY -->
      <div class="sheet-body">

        <!-- LEFT COLUMN -->
        <div class="sheet-col">

          <!-- STATS -->
          <div class="sheet-section">
            <div class="section-header">CHARACTER STATS</div>
            <div class="stats-grid">
              ${[['strength', 'STR'], ['agility', 'AGI'], ['wisdom', 'WIS'], ['health', 'HLTH'], ['speed', 'SPD'], ['stamina', 'STAM']].map(([k, abbr]) => `
                <div class="stat-box">
                  <div class="stat-abbr">${abbr}</div>
                  <div class="stat-val">${ch.stats[k]}</div>
                  <div class="stat-max">/${STAT_META[k].max}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- DERIVED -->
          <div class="sheet-section">
            <div class="section-header">DERIVED STATS</div>
            <div class="derived-grid">
              <div class="derived-item">
                <span class="derived-label">Max HP</span>
                <span class="derived-value hp">${d.hp}</span>
              </div>
              <div class="derived-item">
                <span class="derived-label">Current HP</span>
                <input type="number" class="hp-input" min="0" max="${d.hp}"
                       value="${ch.currentHP ?? d.hp}"
                       onchange="updateCurrentHP(this.value)">
              </div>
              <div class="derived-item">
                <span class="derived-label">Speed</span>
                <span class="derived-value">${d.totalSpd} ft</span>
              </div>
              <div class="derived-item">
                <span class="derived-label">Attack Bonus</span>
                <span class="derived-value">+${d.atkBonus}</span>
              </div>
              <div class="derived-item">
                <span class="derived-label">Weapon Dmg Bonus</span>
                <span class="derived-value">+${d.wepDmgBonus}</span>
              </div>
              <div class="derived-item">
                <span class="derived-label">Light Dmg Bonus</span>
                <span class="derived-value">+${d.ltDmgBonus}</span>
              </div>
              <div class="derived-item">
                <span class="derived-label">Stamina Tier</span>
                <span class="derived-value small">${d.staminaTier}</span>
              </div>
              ${d.chaosCharges !== null ? `
                <div class="derived-item">
                  <span class="derived-label">Chaos Charges</span>
                  <span class="derived-value">${d.chaosCharges}</span>
                </div>`: ''}
              <div class="derived-item">
                <span class="derived-label">Fall Damage</span>
                <span class="derived-value small">1d6 per 10ft${ch.class === 'hunter' ? ' (½ with roll)' : ch.class === 'warlock' ? ' (glide)' : ''}</span>
              </div>
            </div>
          </div>

          <!-- COMBAT ACTIONS -->
          <div class="sheet-section">
            <div class="section-header">COMBAT ACTIONS</div>
            <div class="action-list">
              <div class="action-item">
                <span class="action-label light">⚡ Light Actions</span>
                <span class="action-val">${d.lightActions}</span>
              </div>
              <div class="action-item">
                <span class="action-label major">⚔ Major Actions</span>
                <span class="action-val">${d.majorActions}</span>
              </div>
              <div class="action-item">
                <span class="action-label bonus">✦ Bonus Action</span>
                <span class="action-val">1</span>
              </div>
              <div class="action-item">
                <span class="action-label move">↦ Movement</span>
                <span class="action-val">${d.totalSpd} ft</span>
              </div>
            </div>
          </div>

          <!-- RACE -->
          <div class="sheet-section">
            <div class="section-header">RACE: ${race.name.toUpperCase()}</div>
            <ul class="trait-list">
              ${race.traits.map(t => `<li>${t}</li>`).join('')}
            </ul>
            ${race.raceAbilities.length ? `
              <div class="race-light-abilities">
                ${race.raceAbilities.map(a => `
                  <div class="race-ability">
                    <span class="race-ability-name">⚡ ${a.name}</span>
                    <span class="race-ability-desc">${a.description}</span>
                  </div>`).join('')}
              </div>`: ''}
          </div>

        </div>

        <!-- RIGHT COLUMN -->
        <div class="sheet-col">

          <!-- CLASS TRAITS -->
          <div class="sheet-section">
            <div class="section-header">CLASS: ${cls.name.toUpperCase()}</div>
            <ul class="trait-list">
              ${cls.classTraits.map(t => `<li>${t}</li>`).join('')}
            </ul>
            ${sub.specialRule ? `<div class="special-rule-box">⚡ ${sub.specialRule}</div>` : ''}
          </div>

          <!-- WEAPONS -->
          <div class="sheet-section">
            <div class="section-header">WEAPONS (${cls.weaponSlots} slot${cls.weaponSlots > 1 ? 's' : ''})</div>
            <div class="gear-slots">
              ${[0, 1, 2].filter(i => i < cls.weaponSlots).map(i => `
                <div class="gear-slot">
                  <span class="slot-label">Slot ${i + 1} — ${i === 0 ? 'Equipped' : i === 1 ? 'Holstered' : 'Extra (Hunter)'}</span>
                  <input type="text" class="slot-input"
                         value="${esc(ch.weapons[i] || '')}" placeholder="Empty…"
                         onchange="updateWeapon(${i},this.value)">
                </div>
              `).join('')}
            </div>
          </div>

          <!-- ARMOR -->
          <div class="sheet-section">
            <div class="section-header">ARMOR (Helmet · Chest · Boots)</div>
            <div class="armor-grid">
              ${[['helmet', 'Helmet'], ['chest', 'Chest'], ['boots', 'Boots']].map(([k, lbl]) => `
                <div class="armor-row">
                  <span class="armor-label">${lbl}</span>
                  <input type="text" class="slot-input"
                         value="${esc(ch.armor[k] || '')}" placeholder="Equipped…"
                         onchange="updateArmor('${k}',this.value)">
                  <input type="text" class="slot-input spare"
                         value="${esc(ch.armor[k + 'Spare'] || '')}" placeholder="Spare…"
                         onchange="updateArmor('${k}Spare',this.value)">
                </div>
              `).join('')}
            </div>
          </div>

          <!-- GRENADES -->
          <div class="sheet-section">
            <div class="section-header">GRENADES (2 max · replenish on long rest)</div>
            <div class="grenade-options">
              ${cls.grenadeOptions.map(g => `
                <div class="grenade-info"><strong>${g}:</strong> ${GRENADE_DESCS[g]}</div>
              `).join('')}
            </div>
            <div class="grenade-slots">
              ${[1, 2].map(slot => `
                <div class="gear-slot">
                  <span class="slot-label">Slot ${slot}</span>
                  <select class="slot-select" onchange="updateGrenade(${slot},this.value)">
                    ${cls.grenadeOptions.map(g => `
                      <option value="${g}" ${(slot === 1 ? ch.grenadeSlot1 : ch.grenadeSlot2) === g ? 'selected' : ''}>${g}</option>
                    `).join('')}
                  </select>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- MELEES -->
          <div class="sheet-section">
            <div class="section-header">MELEES</div>
            <div class="melee-list">
              ${cls.meleeOptions.map(m => `
                <div class="melee-item"><strong>${m}:</strong> ${MELEE_DESCS[m]}</div>
              `).join('')}
            </div>
          </div>

          <!-- LIGHT ABILITIES -->
          <div class="sheet-section">
            <div class="section-header">⚡ LIGHT ABILITIES — ${sub.name} (LL ${ch.lightLevel})</div>
            <div class="ability-grid">
              ${sub.abilities.map(a => {
                const known = ch.selectedAbilities.includes(a.id);
                return `
                  <div class="ability-card ${known ? 'unlocked' : 'locked'}">
                    <div class="ability-card-header">
                      <span class="ability-type-badge ${a.type}">${a.type}</span>
                      <span class="ability-card-name">${a.name}</span>
                      <span class="ability-status ${known ? '' : 'locked'}">${known ? '✓ Known' : '🔒'}</span>
                    </div>
                    ${known ? `<div class="ability-card-desc">${a.description.replace(/\n/g, '<br>')}</div>` : ''}
                  </div>
                `;
            }).join('')}
            </div>
          </div>

          <!-- SUPER -->
          <div class="sheet-section ${ch.lightLevel < 3 ? 'locked-section' : ''}">
            <div class="section-header">
              ⚡ SUPER
              ${ch.lightLevel < 3 ? '(Unlocks at LL 3)' :
                    `(${superCharges} charge${superCharges !== 1 ? 's' : ''} · resets on long rest)`}
            </div>
            ${ch.lightLevel < 3 ?
                    `<div class="locked-content">🔒 Unlocks at Light Level 3</div>` :
                    `<div class="super-content">
                <div class="super-base">${cls.superDescription}</div>
                <div class="super-subclass"><strong>${sub.name} bonus:</strong> ${cls.superSubclassBonuses[ch.subclass]}</div>
               </div>`}
          </div>

          <!-- GLIMMER -->
          <div class="sheet-section">
            <div class="section-header">GLIMMER</div>
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:1.2rem">💰</span>
              <input type="number" min="0" class="form-input" style="width:140px;text-align:right"
                     value="${ch.glimmer || 0}"
                     oninput="updateGlimmer(this.value)">
            </div>
          </div>

          <!-- NOTES -->
          <div class="sheet-section">
            <div class="section-header">NOTES</div>
            <textarea class="notes-area" placeholder="Quest notes, inventory, allies, enemies…"
                      onchange="updateNotes(this.value)">${esc(ch.notes || '')}</textarea>
          </div>

        </div>
      </div>
    </div>
  `;
        }

        /* ==========================================================
           ACTIONS — NAVIGATION
        ========================================================== */
        function goHome() { STATE.view = 'home'; STATE.draft = null; render(); }

        function startCreator() {
            STATE.view = 'creator';
            STATE.step = 1;
            STATE.draft = {
                name: '', race: null, class: null, subclass: null,
                startingCL: 3, startingLL: 1,
                selectedAbilities: [],
                statPoints: { strength: 0, agility: 0, wisdom: 0, health: 0, speed: 0, stamina: 0 }
            };
            render();
        }

        function viewChar(id) { STATE.activeId = id; STATE.view = 'sheet'; render(); }

        function deleteChar(id) {
            if (!confirm('Permanently delete this guardian?')) return;
            STATE.chars = STATE.chars.filter(c => c.id !== id);
            save(); render();
        }

        function nextStep() { STATE.step++; render(); }
        function prevStep() { STATE.step--; render(); }

        function updateStep1Next() {
            const btn = document.getElementById('step1-next');
            if (btn) btn.disabled = !(STATE.draft.name && STATE.draft.race);
        }

        /* ==========================================================
           ACTIONS — CREATOR
        ========================================================== */
        function selRace(id) { STATE.draft.race = id; render(); updateStep1Next(); }
        function selClass(id) { STATE.draft.class = id; STATE.draft.subclass = null; STATE.draft.selectedAbilities = []; render(); }
        function selSubclass(id) { STATE.draft.subclass = id; STATE.draft.selectedAbilities = []; render(); }

        function toggleAbility(id) {
            const sel = STATE.draft.selectedAbilities;
            const maxAbilities = STATE.draft.startingLL + 1;
            if (sel.includes(id)) STATE.draft.selectedAbilities = sel.filter(a => a !== id);
            else if (sel.length < maxAbilities) STATE.draft.selectedAbilities = [...sel, id];
            render();
        }

        function adjCreatorStat(key, delta) {
            const pts = STATE.draft.statPoints;
            const newV = (pts[key] || 0) + delta;
            if (newV < 0) return;
            const ptsPerLv = STATE.draft.subclass === 'breaker' ? 6 : 3;
            const total = ptsPerLv * STATE.draft.startingCL;
            const spent = Object.values(pts).reduce((a, b) => a + b, 0) + delta;
            if (spent > total) return;
            if (newV > STAT_META[key].max) return;
            pts[key] = newV;
            render();
        }

        function finishCreation() {
            const dr = STATE.draft;
            const id = 'ch_' + Date.now();
            const ch = {
                id, name: dr.name || 'Unknown Guardian',
                race: dr.race, class: dr.class, subclass: dr.subclass,
                lightLevel: dr.startingLL, characterLevel: dr.startingCL, unspentPoints: 0,
                stats: { strength: 0, agility: 0, wisdom: 0, health: 0, speed: 0, stamina: 0 },
                selectedAbilities: [...dr.selectedAbilities],
                weapons: ['', '', ''],
                armor: { helmet: '', helmetSpare: '', chest: '', chestSpare: '', boots: '', bootsSpare: '' },
                grenadeSlot1: CLASSES[dr.class].grenadeOptions[0],
                grenadeSlot2: CLASSES[dr.class].grenadeOptions[1],
                notes: '', glimmer: 0, currentHP: null
            };
            for (const [k, v] of Object.entries(dr.statPoints)) ch.stats[k] += v;
            ch.currentHP = ch.stats.health * CLASSES[ch.class].healthConversion;
            STATE.chars.push(ch);
            save();
            STATE.activeId = id; STATE.view = 'sheet'; STATE.draft = null;
            render();
        }

        /* ==========================================================
           ACTIONS — SHEET EDITS
        ========================================================== */
        function getActive() { return STATE.chars.find(c => c.id === STATE.activeId); }

        function updateWeapon(i, v) { const c = getActive(); if (!c) return; c.weapons[i] = v; save(); }
        function updateArmor(k, v) { const c = getActive(); if (!c) return; c.armor[k] = v; save(); }
        function updateGrenade(slot, v) { const c = getActive(); if (!c) return; if (slot === 1) c.grenadeSlot1 = v; else c.grenadeSlot2 = v; save(); }
        function updateNotes(v) { const c = getActive(); if (!c) return; c.notes = v; save(); }
        function updateGlimmer(v) { const c = getActive(); if (!c) return; c.glimmer = Math.max(0, parseInt(v, 10) || 0); save(); }
        function updateCurrentHP(v) {
            const c = getActive(); if (!c) return;
            const d = derived(c);
            c.currentHP = Math.max(0, Math.min(d.hp, parseInt(v) || 0));
            save();
        }

        /* ==========================================================
           LEVEL UP MODAL
        ========================================================== */
        function openAddCharacterPoints() {
            const ch = getActive(); if (!ch) return;
            showModal(`
    <div class="levelup-modal">
      <h3>Add Character Points — ${esc(ch.name)}</h3>
      <p>Each character point grants <strong>3 stat points</strong> to allocate.</p>
      <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin:18px 0">
        <button class="stat-btn" onclick="adjCPInput(-1)">−</button>
        <span id="cp-input-val" style="font-size:1.6rem;font-weight:700;min-width:2rem;text-align:center">1</span>
        <button class="stat-btn" onclick="adjCPInput(1)">+</button>
      </div>
      <p style="color:var(--text-muted);font-size:.85rem;text-align:center">
        = <span id="cp-stat-preview">3</span> stat points to allocate
      </p>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" style="flex:2" onclick="doAddCharacterPoints()">Allocate Points</button>
      </div>
    </div>
  `);
            window._cpCount = 1;
        }

        function adjCPInput(delta) {
            window._cpCount = Math.max(1, (window._cpCount || 1) + delta);
            const el = document.getElementById('cp-input-val');
            const pr = document.getElementById('cp-stat-preview');
            if (el) el.textContent = window._cpCount;
            if (pr) pr.textContent = window._cpCount * 3;
        }

        function doAddCharacterPoints() {
            const ch = getActive(); if (!ch) return;
            const count = window._cpCount || 1;
            const pts = count * 3;
            STATE.pendingLevelUp = {
                charId: ch.id,
                type: 'charpoints',
                cpCount: count,
                newLevel: ch.characterLevel,
                pointsTotal: pts,
                allocated: { strength: 0, agility: 0, wisdom: 0, health: 0, speed: 0, stamina: 0 }
            };
            STATE.modalLocked = true;
            closeModal();
            openStatAlloc();
        }

        function openLevelUp() {
            const ch = getActive(); if (!ch) return;
            const sub = SUBCLASSES[ch.subclass];
            showModal(`
    <div class="levelup-modal">
      <h3>Level Up — ${esc(ch.name)}</h3>
      <p>Choose which category to advance:</p>
      <div class="levelup-options">
        <button class="btn btn-primary" onclick="doLevelUp('character')" ${ch.characterLevel >= 20 ? 'disabled' : ''}>
          Character Level (CL ${ch.characterLevel} → ${Math.min(20, ch.characterLevel + 1)})
          <small>Gain ${ptsPerLevel(ch)} stat points to allocate</small>
        </button>
        <button class="btn btn-secondary" onclick="doLevelUp('light')" ${ch.lightLevel >= 5 ? 'disabled' : ''}>
          Light Level (LL ${ch.lightLevel} → ${Math.min(5, ch.lightLevel + 1)})
          <small>Unlock 1 new ability · abilities scale with new LL</small>
        </button>
      </div>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  `);
        }

        function doLevelUp(type) {
            const ch = getActive(); if (!ch) return;
            if (type === 'character') {
                if (ch.characterLevel >= 20) return;
                const pts = ptsPerLevel(ch);
                STATE.pendingLevelUp = {
                    charId: ch.id,
                    type: 'levelup',
                    newLevel: ch.characterLevel + 1,
                    pointsTotal: pts,
                    allocated: { strength: 0, agility: 0, wisdom: 0, health: 0, speed: 0, stamina: 0 }
                };
                STATE.modalLocked = true;
                closeModal();
                openStatAlloc();
            } else {
                if (ch.lightLevel >= 5) return;
                ch.lightLevel++;
                save(); closeModal();
                openAbilityUnlock();
                render();
            }
        }

        function openStatAlloc() {
            const ch = getActive(); if (!ch) return;
            const pending = STATE.pendingLevelUp; if (!pending) return;

            const totalSpent = Object.values(pending.allocated).reduce((a, b) => a + b, 0);
            const remaining = pending.pointsTotal - totalSpent;

            showModal(`
      <div class="levelup-modal">
        <h3>${pending.type === 'charpoints' ? `Allocate Stat Points — ${pending.cpCount} CP (${pending.pointsTotal} pts)` : `Allocate Stat Points — CL ${ch.characterLevel} → ${pending.newLevel}`}</h3>
        <p style="color:var(--text-muted);font-size:.85rem;margin-bottom:10px">
          Distribute <strong>${pending.pointsTotal}</strong> point${pending.pointsTotal !== 1 ? 's' : ''}.
          Use − to undo any allocation before confirming.
        </p>
        <div class="points-remaining ${remaining === 0 ? 'done' : ''}" style="margin-bottom:12px">
          Points remaining: <strong>${remaining}</strong>
        </div>
        <div class="stat-alloc-grid modal-stat-grid">
          ${Object.entries(STAT_META).map(([k, meta]) => {
                const cur = ch.stats[k];
                const alloc = pending.allocated[k];
                const newVal = cur + alloc;
                return `
            <div class="stat-alloc-row">
              <div class="stat-alloc-label">
                <span class="stat-name">${meta.label}</span>
                <span class="stat-hint-small">
                  ${cur}${alloc > 0 ? ` <span style="color:var(--success)">+${alloc}</span>` : ''} / ${meta.max}
                </span>
              </div>
              <div class="stat-alloc-controls">
                <button class="stat-btn" onclick="adjPendingStat('${k}',-1)" ${alloc <= 0 ? 'disabled' : ''}>−</button>
                <span class="stat-value">${newVal}</span>
                <button class="stat-btn" onclick="adjPendingStat('${k}',1)"  ${remaining <= 0 || newVal >= meta.max ? 'disabled' : ''}>+</button>
              </div>
            </div>
          `;
            }).join('')}
        </div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn btn-outline" style="flex:1" onclick="cancelLevelUp()">Cancel</button>
          <button class="btn btn-primary" style="flex:2" onclick="confirmLevelUp()" ${remaining !== 0 ? 'disabled' : ''}>
            ${remaining === 0 ? (pending.type === 'charpoints' ? '✓ Confirm Character Points' : '✓ Confirm Level Up') : `Allocate ${remaining} more point${remaining !== 1 ? 's' : ''}…`}
          </button>
        </div>
      </div>
    `);
        }

        function adjPendingStat(key, delta) {
            const pending = STATE.pendingLevelUp; if (!pending) return;
            const ch = getActive(); if (!ch) return;
            const alloc = pending.allocated[key] || 0;
            const newAlloc = alloc + delta;
            if (newAlloc < 0) return;
            const totalSpent = Object.values(pending.allocated).reduce((a, b) => a + b, 0) + delta;
            if (totalSpent > pending.pointsTotal) return;
            if (delta > 0 && ch.stats[key] + newAlloc >= STAT_META[key].max) return;
            pending.allocated[key] = newAlloc;
            openStatAlloc();
        }

        function confirmLevelUp() {
            const ch = getActive(); if (!ch) return;
            const pending = STATE.pendingLevelUp; if (!pending) return;
            const totalSpent = Object.values(pending.allocated).reduce((a, b) => a + b, 0);
            if (totalSpent !== pending.pointsTotal) return;
            if (pending.type !== 'charpoints') ch.characterLevel = pending.newLevel;
            for (const [k, v] of Object.entries(pending.allocated)) ch.stats[k] += v;
            STATE.pendingLevelUp = null;
            STATE.modalLocked = false;
            save(); closeModal(); render();
        }

        function cancelLevelUp() {
            STATE.pendingLevelUp = null;
            STATE.modalLocked = false;
            closeModal(); render();
        }

        function openAbilityUnlock() {
            const ch = getActive(); if (!ch) return;
            const sub = SUBCLASSES[ch.subclass];
            const available = sub.abilities.filter(a => !ch.selectedAbilities.includes(a.id));
            if (available.length === 0) {
                showModal(`<div class="levelup-modal"><h3>All Abilities Unlocked!</h3><p>Your subclass has no more abilities to unlock.</p><button class="btn btn-primary" onclick="closeModal()">OK</button></div>`);
                return;
            }
            showModal(`
    <div class="levelup-modal ability-unlock-modal">
      <h3>Unlock a New Ability (LL ${ch.lightLevel})</h3>
      <p>Select 1 ability to add to your sheet:</p>
      <div class="ability-selection-grid">
        ${available.map(a => `
          <div class="ability-select-card" onclick="unlockAbility('${a.id}')">
            <div class="ability-select-header">
              <span class="ability-type-badge ${a.type}">${a.type}</span>
              <span class="ability-select-name">${a.name}</span>
            </div>
            <div class="ability-select-desc">${a.description.replace(/\n/g, '<br>')}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-outline" style="margin-top:12px" onclick="closeModal()">Cancel</button>
    </div>
  `);
        }

        function unlockAbility(id) {
            const ch = getActive(); if (!ch) return;
            ch.selectedAbilities.push(id);
            save(); closeModal(); render();
        }

        function closeModalAndRender() { closeModal(); render(); }

        /* ==========================================================
           EXPORT / IMPORT
        ========================================================== */
        function downloadJSON(data, filename) {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function exportAll() {
            if (!STATE.chars.length) return;
            const date = new Date().toISOString().slice(0, 10);
            downloadJSON({ version: 1, chars: STATE.chars }, `deen-and-destiny-backup-${date}.json`);
        }

        function exportOne(id) {
            const ch = STATE.chars.find(c => c.id === id);
            if (!ch) return;
            const safe = ch.name.replace(/[^a-z0-9]/gi, '-').toLowerCase();
            downloadJSON({ version: 1, chars: [ch] }, `${safe}-character.json`);
        }

        function triggerImport() {
            document.getElementById('import-file').value = '';
            document.getElementById('import-file').click();
        }

        function importFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = evt => {
                try {
                    const data = JSON.parse(evt.target.result);
                    const incoming = Array.isArray(data) ? data
                        : (data.chars && Array.isArray(data.chars)) ? data.chars
                            : null;
                    if (!incoming || !incoming.length) { alert('No character data found in that file.'); return; }
                    let added = 0, skipped = 0;
                    for (const ch of incoming) {
                        if (!ch.id || !ch.name || !ch.class) { skipped++; continue; }
                        if (STATE.chars.find(c => c.id === ch.id)) {
                            // Duplicate id — assign a new one
                            ch.id = 'ch_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                        }
                        STATE.chars.push(ch);
                        added++;
                    }
                    save();
                    render();
                    if (skipped) alert(`Imported ${added} guardian${added !== 1 ? 's' : ''}. ${skipped} entr${skipped !== 1 ? 'ies' : 'y'} skipped (invalid format).`);
                } catch (err) {
                    alert('Failed to parse file. Make sure it is a valid Deen & Destiny JSON export.');
                }
            };
            reader.readAsText(file);
        }

        /* ==========================================================
           MODAL
        ========================================================== */
        function showModal(html) {
            const el = document.getElementById('modal-content');
            el.innerHTML = html;
            document.getElementById('modal-overlay').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }
        function handleOverlayClick(e) {
            if (STATE.modalLocked) return;
            if (e.target === e.currentTarget) closeModal();
        }

        /* ==========================================================
           UTILITY
        ========================================================== */
        function esc(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        /* ==========================================================
           INIT
        ========================================================== */
        load();
        render();
    </script>
</body>

</html>
